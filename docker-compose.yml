version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: carelink-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: carelink_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: carelink-redis
    restart: always
    ports:
      - "6379:6379"

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: carelink-ml-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carelink-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://postgres:postgrespassword@postgres:5432/carelink_db?sslmode=disable
      - JWT_SECRET=super-secret-carelink-jwt-key-change-in-production-2026
      - REFRESH_TOKEN_SECRET=super-secret-carelink-refresh-key-change-in-production-2026
      - ML_SERVICE_URL=http://ml-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ml-service:
        condition: service_started
    command: sh -c "npx prisma db push && npm start"

volumes:
  postgres_data:
